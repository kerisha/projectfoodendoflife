<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Expiry Tracker</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --text:#222; --muted:#777; --line:#e6e1d9;
          --ok:#2e7d32; --soon:#e68a00; --bad:#c62828; --accent:#3b6e4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#201f1c; --text:#eee; --muted:#9a968e; --line:#33312c;
            --ok:#66bb6a; --soon:#ffb74d; --bad:#ef5350; --accent:#6fb58a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  input, select, button { font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px;
                          background:var(--card); color:var(--text); }
  input[name=name] { flex:1 1 180px; }
  button.add { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
       border-left:6px solid var(--ok); border-radius:8px; padding:10px 12px; }
  li.soon { border-left-color:var(--soon); }
  li.bad { border-left-color:var(--bad); }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; overflow-wrap:anywhere; }
  .when { font-size:.85rem; color:var(--muted); }
  .status { font-size:.85rem; font-weight:600; white-space:nowrap; }
  li.soon .status { color:var(--soon); } li.bad .status { color:var(--bad); } li .status { color:var(--ok); }
  .del { background:none; border:0; color:var(--muted); cursor:pointer; font-size:1.2rem; padding:4px 8px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
</style>
</head>
<body>
<main>
  <h1>🥫 Kitchen Expiry Tracker</h1>
  <form id="form">
    <input name="name" placeholder="Item (e.g. milk)" required>
    <input name="date" type="date" required>
    <button class="add" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script>
const KEY = 'kitchen-expiry-items';
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };
const daysLeft = d => Math.round((new Date(d + 'T00:00:00') - new Date().setHours(0,0,0,0)) / 864e5);

function label(n) {
  if (n < 0) return `Expired ${-n}d ago`;
  if (n === 0) return 'Expires today';
  if (n === 1) return '1 day left';
  return `${n} days left`;
}

function render() {
  const list = document.getElementById('list');
  list.textContent = '';
  if (!items.length) {
    list.innerHTML = '<li class="empty" style="display:block;border:0;background:none">Nothing tracked yet.</li>';
    return;
  }
  [...items].sort((a, b) => a.date.localeCompare(b.date)).forEach(it => {
    const n = daysLeft(it.date);
    const li = document.createElement('li');
    li.className = n < 0 ? 'bad' : n <= 3 ? 'soon' : '';
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = it.name;
    const when = document.createElement('div'); when.className = 'when'; when.textContent = it.date;
    info.append(name, when);
    const st = document.createElement('div'); st.className = 'status'; st.textContent = label(n);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
    del.title = 'Remove'; del.onclick = () => { items = items.filter(x => x.id !== it.id); save(); render(); };
    li.append(info, st, del);
    list.append(li);
  });
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  items.push({ id: Date.now() + Math.random(), name: f.name.value.trim(), date: f.date.value });
  save(); render(); f.reset(); f.name.focus();
});

render();
</script>
</body>
</html>
